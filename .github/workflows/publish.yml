name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Verify tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun -e 'if (process.env.RELEASE_TAG !== `v${(await Bun.file("package.json").json()).version}`) process.exit(1)'
      - run: bun run typecheck
      # prepack builds and tests before the tarball is made.
      - run: |
          version=$(bun -p "require('./package.json').version")
          case "$version" in *-*) channel=next ;; *) channel=latest ;; esac
          bun x --bun npm@latest publish --access public --tag "$channel"

[package]
name = "tauri-plugin-alwith-desktop-shell"
version = "0.5.2"
edition = "2024"
links = "tauri-plugin-alwith-desktop-shell"
license = "AGPL-3.0-only"
[workspace]
[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.3", features = ["build"] }
[dependencies]
tauri = "3.0.0-alpha.5"
serde = { version = "1", features = ["derive"] }
log = "0.4"
atlas-tauri = "0.1.10"
tauri-plugin-updater = { version = "3.0.0-alpha.3", default-features = false, features = ["rustls-tls", "system-proxy"] }
rfd = { version = "0.16", default-features = false, features = ["tokio", "gtk3", "common-controls-v6"] }

tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread"] }
base64 = "0.23"
minisign-verify = "0.3"
semver = "1"
serde_json = "1"

[package]
name = "alwith-desktop-shell"
version = "0.6.6"
edition = "2024"
links = "alwith-desktop-shell"
license = "AGPL-3.0-only"
description = "Default native desktop shell for ALwith applications: menus, window chrome, CLI status and signed application updates"
repository = "https://github.com/ALwith-ai/alwith-desktop-shell"
include = ["/Cargo.toml", "/build.rs", "src/**/*.rs", "permissions/**/*"]
readme = false
[workspace]
[features]
default = ["updates"]
# Signed application updates. An application without auto update turns the default features off and
# gets no updater code or `tauri-plugin-updater`.
updates = ["dep:tauri-plugin-updater", "dep:semver", "dep:libc", "dep:flate2", "dep:tar"]
[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.4", features = ["build"] }
[dependencies]
tauri = "3.0.0-alpha.6"
serde = { version = "1", features = ["derive"] }
log = "0.4"
atlas-tauri = "0.1"
tauri-plugin-updater = { version = "3.0.0-alpha.3", default-features = false, features = ["rustls-tls", "system-proxy"], optional = true }
# Linux is not shipped. rfd's default xdg-portal backend keeps gtk-sys out of the dependency graph,
# where rfd 0.18's gtk3 backend (gtk-sys 0.19) would conflict with tao and wry (gtk-sys 0.18).
rfd = { version = "0.18", features = ["common-controls-v6"] }

tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread"] }
semver = { version = "1", optional = true }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics", "NSScreen"] }
flate2 = { version = "1.1", optional = true }
tar = { version = "0.4", optional = true }

[package]
name = "alwith-desktop-shell"
version = "0.6.1"
edition = "2024"
links = "alwith-desktop-shell"
license = "AGPL-3.0-only"
license-file = "../LICENSE"
description = "Default native desktop shell for ALwith applications: menus, window chrome, CLI status and signed application updates"
repository = "https://github.com/ALwith-ai/alwith-desktop-shell"
include = ["/Cargo.toml", "/build.rs", "src/**/*.rs", "permissions/**/*"]
readme = false
[workspace]
[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.3", features = ["build"] }
[dependencies]
tauri = "3.0.0-alpha.5"
serde = { version = "1", features = ["derive"] }
log = "0.4"
atlas-tauri = "0.1.10"
tauri-plugin-updater = { version = "3.0.0-alpha.3", default-features = false, features = ["rustls-tls", "system-proxy"] }
rfd = { version = "0.16", default-features = false, features = ["tokio", "gtk3", "common-controls-v6"] }

tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread"] }
semver = "1"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
flate2 = "1.1"
tar = "0.4"
